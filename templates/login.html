{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="box">
    <h1>Login</h1>

    <form method="POST">

        <label>Email</label>
        <input type="email"
               name="email"
               class="form-control"
               placeholder="Enter Email"
               autocomplete="email"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               class="form-control"
               placeholder="Enter Password"
               autocomplete="current-password"
               required>

        <button type="submit" class="btn btn-primary">
            Login
        </button>

    </form>

</div>

{% endblock %}
